<svg xmlns="http://www.w3.org/2000/svg" width="50" height="24" viewBox="0 0 50 24">
  <!-- Baseline -->
  <line x1="0" y1="22" x2="50" y2="22" stroke="#ffd166" stroke-width="1"/>
  <!-- Major tick (every 50) -->
  <line x1="0" y1="6" x2="0" y2="22" stroke="#ffd166" stroke-width="1.5"/>
  <!-- Medium tick (mid) -->
  <line x1="25" y1="12" x2="25" y2="22" stroke="#ffd166" stroke-width="1"/>
  <!-- Minor ticks -->
  <line x1="10" y1="16" x2="10" y2="22" stroke="#ffd166" stroke-width="0.75"/>
  <line x1="20" y1="16" x2="20" y2="22" stroke="#ffd166" stroke-width="0.75"/>
  <line x1="30" y1="16" x2="30" y2="22" stroke="#ffd166" stroke-width="0.75"/>
  <line x1="40" y1="16" x2="40" y2="22" stroke="#ffd166" stroke-width="0.75"/>
</svg>
